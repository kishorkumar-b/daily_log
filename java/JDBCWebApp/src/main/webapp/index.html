<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Student</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-container {
      background: #fff;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      width: 350px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    label {
      display: block;
      text-align: left;
      margin-bottom: 6px;
      color: #555;
      font-weight: 500;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      border-color: #2575fc;
      outline: none;
    }

    input[type="submit"] {
      background: #2575fc;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.3s;
    }

    input[type="submit"]:hover {
      background: #1b5edb;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Add Student</h2>
    <form action="addStudent" method="post">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>

      <label for="course">Course:</label>
      <input type="text" id="course" name="course" required>

      <input type="submit" value="Add Student">
    </form>
  </div>
</body>
</html>
