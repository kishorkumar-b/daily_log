<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employee Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h2 class="text-center mb-4">Employee Management System</h2>

<a href="/add" class="btn btn-success mb-3">Add Employee</a>

<table class="table table-bordered">
    <thead>
    <tr>
        <th>ID</th><th>Name</th><th>Department</th><th>Salary</th><th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="emp : ${employees}">
        <td th:text="${emp.id}"></td>
        <td th:text="${emp.name}"></td>
        <td th:text="${emp.department}"></td>
        <td th:text="${emp.salary}"></td>
        <td>
            <a th:href="@{'/edit/' + ${emp.id}}" class="btn btn-primary btn-sm">Edit</a>
            <a th:href="@{'/delete/' + ${emp.id}}" class="btn btn-danger btn-sm">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
