<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Employee</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<h2>Edit Employee</h2>

<form action="/update" method="post">
    <input type="hidden" name="id" th:value="${employee.id}">
    <div class="mb-3">
        <label>Name</label>
        <input type="text" name="name" th:value="${employee.name}" class="form-control"/>
    </div>
    <div class="mb-3">
        <label>Department</label>
        <input type="text" name="department" th:value="${employee.department}" class="form-control"/>
    </div>
    <div class="mb-3">
        <label>Salary</label>
        <input type="number" step="0.01" name="salary" th:value="${employee.salary}" class="form-control"/>
    </div>
    <button class="btn btn-primary">Update</button>
    <a href="/" class="btn btn-secondary">Cancel</a>
</form>

</body>
</html>
